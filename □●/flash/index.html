<!doctype html>
<html lang="en" data-bs-core="modern" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>□● Squares &amp; Circles</title>

  <link href="./vendor/halfmoon-2.0.2.min.css" rel="stylesheet" />
  <link href="./vendor/fonts.css" rel="stylesheet" />
  <link href="./theme.css" rel="stylesheet" />
  <script src="./js/index.js" type="module"></script>
</head>

<body>

  <div class="sc-shell">
    <!-- the module: picture, name, connection, firmware, flash (index.js keeps it up to date); the pages -->
    <aside class="sc-side">
      <a class="sc-brand" href="#home">
        <span class="sc-logo" aria-hidden="true"><span class="sq"></span><span class="ci"></span></span>
        <span>Squares &amp; Circles</span>
        <span class="sc-preview" id="preview_badge" title="?preview: the next release (refs/preview/main), not main" hidden>preview</span>
      </a>

      <div class="sc-card">
        <div class="sc-device">
          <div class="sc-thumb"><img id="img_module" src="img/u_oc.png" alt="" hidden /></div>
          <div class="sc-device-text">
            <span class="sc-device-name" id="device_name">No module</span>
            <span class="sc-status" id="device_status">not connected</span>
          </div>
        </div>
        <div class="sc-device-sub"><span id="connected"></span><span id="device_fw"></span></div>
        <div class="sc-meter-box" id="device_meter" hidden>
          <div class="sc-meter-head"><span>App flash</span><span class="mono" id="device_meter_text"></span></div>
          <div class="sc-meter"><div id="device_meter_bar" style="width: 0"></div></div>
        </div>
        <button class="btn" id="connect">connect</button>
      </div>

      <nav class="sc-nav" aria-label="Pages">
        <a href="#module" data-tab="module"><span>Module</span></a>
        <a href="#library" data-tab="library"><span>Library</span><span class="count" id="nav_updates"></span></a>
        <a href="#live" data-tab="live" id="nav_live" hidden><span>Live</span></a>
        <a href="#loader" data-tab="loader"><span>Install loader</span></a>
        <a href="#debug" data-tab="debug" id="nav_debug" hidden><span>Debug</span></a>
      </nav>
    </aside>

    <main id="app" class="sc-content"></main>
  </div>

  <div>
    <div class="modal fade" id="flashing" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title" id="modal-title-1">
              <div id="log2"></div>
            </h1>
          </div>
          <div class="modal-body">
            <progress id="progress" value="0" max="100" style="width: 100%;" hidden></progress>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalConnect" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title">□●</h1>
          </div>
          <!-- the text and the buttons from remoteBulk.js showNoModule() -->
          <div class="modal-body">
            <p id="connect_hint" style="margin: 0">No S&amp;C module connected.</p>
            <p class="small mute mono" id="connect_error" style="margin: 8px 0 0" hidden></p>
          </div>
          <div class="modal-footer">
            <button class="btn" data-bs-dismiss="modal">Close</button>
            <a href="#loader" class="btn" id="connect_loader">Install loader</a>
            <button class="btn btn-accent" id="connectButton">Retry</button>
          </div>
        </div>
      </div>
    </div>

    <!-- an app in the emulator: its display, a trigger on T1, its parameters as knobs, sound, MIDI in (js/emulator.js, the
         library's S&C button) -->
    <div class="modal fade" id="emulator" tabindex="-1" aria-labelledby="emu_title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header emu-head">
            <h1 class="modal-title" id="emu_title">Emulator</h1>
            <!-- the engines of the library: another one in the emulator at once, from the list or the one before/after
                 it (js/emulator.js) -->
            <div class="emu-app" id="emu_app_box" hidden>
              <button class="btn" id="emu_prev" title="The engine before this one in the list" aria-label="Previous engine">&lsaquo;</button>
              <select class="form-select" id="emu_app" aria-label="The engine in the emulator"></select>
              <button class="btn" id="emu_next" title="The engine after this one in the list" aria-label="Next engine">&rsaquo;</button>
            </div>
            <!-- right in the head: MIDI in (the inputs once on), sound on/off; what they say: their tooltips -->
            <div class="emu-tools emu-midi">
              <button class="btn" id="emu_midi_btn" hidden><span class="emu-btn-text">MIDI in</span></button>
              <span class="emu-midi-icon" id="emu_midi_icon" hidden></span>
              <select class="form-select" id="emu_midi" aria-label="MIDI input" hidden></select>
              <button class="btn" id="emu_sound" aria-pressed="true" hidden>Sound on</button>
            </div>
          </div>
          <!-- the module (display; under it the trigger and, while loading or after an error, what happened) left, its
               parameters right; one below the other when narrow -->
          <div class="modal-body sc-emu">
            <div class="emu-col">
              <div class="sc-oled"><canvas id="emu_display" width="128" height="64" aria-label="The display of the emulated module"></canvas></div>
              <div class="emu-under">
                <div class="sc-cmds" id="emu_keys"></div>
                <div class="small mute emu-status" id="emu_status"></div>
              </div>
              <!-- a drum kit in multi-trig mode: a button for each instrument (js/emulator.js kitButtons()) -->
              <div class="emu-kit" id="emu_kit" role="group" aria-label="The instruments of the kit, each its own trigger" hidden></div>
              <!-- the outputs of the engine, CV (LFO, envelope, V/OCT, gates) and audio: a lane each, its voltage and the
                   last 2 s (js/scope.js); hidden for an engine without -->
              <div class="emu-scope" id="emu_scope" hidden title="The outputs of the engine, the last 2 seconds: CV with its voltage now, audio (±1 = ±5 V) with its peak">
                <canvas id="emu_scope_canvas" role="img" aria-label="The voltages at the outputs of the engine"></canvas>
              </div>
            </div>
            <div class="emu-col">
              <div class="sc-knobs" id="emu_params" role="group" aria-label="The parameters of the engine shown"></div>
            </div>
          </div>
          <div class="modal-footer emu-foot">
            <button class="btn" id="emu_link" title="A link that opens this engine in the emulator, also without a module">Copy link</button>
            <span class="small mute" id="emu_link_info"></span>
            <button class="btn" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script type="module">

    // --- SPA Router with dynamic import() ---
    // Uses dynamic import() for proper ES module loading:
    //   - Modules appear in DevTools Sources panel with correct names
    //   - Breakpoints and source maps work reliably
    //   - Stack traces show actual call sites
    //   - Proper async error handling via try/catch

    // update/engines: the names before the redesign, old links and bookmarks still work;
    // needsModule: without a connected module the start page instead (index.js scNeedsModule)
    // params: query parameters of the page itself (?cat= the category of the library), kept on a refresh
    const routes = {
      home:      { html: 'pages/start/start.html' },
      module:    { html: 'pages/module/module.html', tab: 'module', needsModule: true },
      update:    { html: 'pages/module/module.html', tab: 'module', needsModule: true },
      library:   { html: 'pages/library/library.html', tab: 'library', params: ["cat"] }, // without a module: the engines of app/
      engines:   { html: 'pages/library/library.html', tab: 'library', params: ["cat"] },
      live:      { html: 'pages/live/live.html', tab: 'live', needsModule: true },
      debug:     { html: 'pages/debug/debug.html', tab: 'debug', needsModule: true }, // its tab only with ?debug
      loader:    { html: 'pages/loader/loader.html', tab: 'loader' },
      privacy:   { html: 'pages/privacy/privacy.html' }, // a draft: no link to it yet, only #privacy
    };

    let _currentCleanup = null;
    let _routeGen = 0;
    let _currentRouteKey = null;

    async function renderRoute() {
      // a newer route change makes this one stop after each await: the older one must not put its page or module
      // over the newer one
      const gen = ++_routeGen;
      const key = location.hash.replace('#', '') || 'home';
      const route = routes[key] || routes.home;
      window.scRouteNeedsModule = !!route.needsModule;
      if (route.needsModule && window.scNeedsModule && window.scNeedsModule(key))
        return; // on to the start page, back here once connected

      for (const a of document.querySelectorAll('.sc-nav a'))
        a.classList.toggle('active', a.dataset.tab == route.tab);

      // Strip query params only when switching to a different route; ?target= (the type of module: the loader and the
      // firmware list go by it), ?demo (demo.js), ?debug (the Debug tab) and ?emu (js/emulator.js) stay, and on the
      // first render (a refresh, a link) the route's own params
      if (key !== _currentRouteKey && location.search) {
        const urlParams = new URLSearchParams(window.location.search);
        const kept = new URLSearchParams();
        const own = _currentRouteKey === null ? route.params || [] : [];
        for (const name of ["target", "demo", "debug", "emu", ...own])
          if (urlParams.has(name))
            kept.set(name, urlParams.get(name));
        history.replaceState({}, '', location.pathname + (kept.size ? "?" + kept : "") + location.hash);
      }
      _currentRouteKey = key;

      // Cleanup previous route module (if it exported a destroy function); window.scRouteCleanup: one a module set
      // itself right away, so that it runs also when the module did not finish loading (pages/debug/debug.js)
      if (_currentCleanup) {
        try { _currentCleanup(); } catch (e) { console.warn('[router] cleanup error:', e); }
      }
      if (window.scRouteCleanup && window.scRouteCleanup !== _currentCleanup) {
        try { window.scRouteCleanup(); } catch (e) { console.warn('[router] cleanup error:', e); }
      }
      _currentCleanup = null;
      window.scRouteCleanup = null;

      // Fetch and inject HTML fragment
      try {
        const res = await fetch(route.html);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (gen !== _routeGen) return;
        // Parse with DOMParser to cleanly extract body content from
        // both full HTML documents and plain fragments
        const doc = new DOMParser().parseFromString(text, 'text/html');
        document.getElementById('app').innerHTML = doc.body.innerHTML;
      } catch (err) {
        console.error('[router] page load error:', err);
        document.getElementById('app').innerHTML =
          `<div class="sc-main"><div class="panel warn">Failed to load page: ${err.message}</div></div>`;
        return;
      }

      document.getElementById("connect").onclick = null;
      document.getElementById("connect").disabled = true;

      // Load route module via dynamic import()
      // Uses Blob + sourceURL so Chrome DevTools maps breakpoints to the real file,
      // while the unique blob URL forces re-evaluation on each route visit.
      // Relative imports are resolved to absolute URLs so they work from blob: context.
      const jsFile = route.html.replace('.html', '.js');
      const jsUrl = new URL(jsFile, location.href).href;
      const jsBase = jsUrl.substring(0, jsUrl.lastIndexOf('/') + 1);
      try {
        const resp = await fetch(jsUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        let source = await resp.text();
        if (gen !== _routeGen) return;
        // Rewrite relative import specifiers (from/import/side-effect) to absolute URLs
        // so they resolve correctly from the blob: origin; also minified code (from"../x.js", import"./y.js")
        source = source.replace(
          /(from\s*['"]|import\s*\(\s*['"]|import\s*['"])(\.\.?\/[^'"]+)(['"])/g,
          (_, prefix, relPath, quote) => prefix + new URL(relPath, jsBase).href + quote
        );
        // import.meta.url of a blob: module is the blob URL, files next to the module are relative to jsUrl
        source = source.replace(/\bimport\.meta\.url\b/g, JSON.stringify(jsUrl));
        const blob = new Blob(
          [source + `\n//# sourceURL=${jsUrl}\n`],
          { type: 'text/javascript' }
        );
        const blobUrl = URL.createObjectURL(blob);
        try {
          const mod = await import(blobUrl);
          if (mod.destroy && gen === _routeGen) {
            _currentCleanup = mod.destroy;
          }
          else if (mod.destroy) {
            mod.destroy(); // the route was left while it loaded
          }
        } finally {
          URL.revokeObjectURL(blobUrl);
        }
        console.debug(`[router] loaded: ${jsFile}`);
      } catch (err) {
        console.error(`[router] module error: ${jsFile}`, err);
      }
    }

    window.addEventListener('hashchange', renderRoute);
    renderRoute();
  </script>

  <script src="./vendor/bootstrap-5.3.3.bundle.min.js"></script>

</body>

</html>
