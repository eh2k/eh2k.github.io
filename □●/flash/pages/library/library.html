<div class="sc-main">
  <h1 class="sc-title">Library</h1>
  <div class="sc-grid">
    <section class="panel">
      <div class="panel-label">Flash memory</div>
      <svg id="svgCanvas" aria-label="Flash memory map"></svg>
      <div id="tooltip" class="xtooltip" style="display: none"></div>
      <div id="summaryText" class="small mute"></div>
      <div id="index_in_chain" class="cmd-note" hidden></div>
    </section>
    <section class="panel">
      <div class="panel-label">Extras</div>
      <div id="extras"></div>
    </section>
  </div>

  <section class="panel flush">
    <div class="panel-head">
      <span class="panel-label">Engines</span>
      <div class="sc-filters" role="group" aria-label="Filter" id="app_filters">
        <button class="btn on" data-filter="all" aria-pressed="true">All</button>
        <button class="btn" data-filter="todo" aria-pressed="false">Updates</button>
        <button class="btn" data-filter="installed" aria-pressed="false">Installed</button>
        <button class="btn" data-filter="available" aria-pressed="false">Available</button>
      </div>
    </div>
    <!-- the categories left as on the module (MACHINE | ENGINE), above the table on a narrow screen (apps.js initTabs) -->
    <div class="sc-lib">
      <div class="sc-tabs" role="tablist" aria-label="Category" aria-orientation="vertical" id="app_tabs"></div>
      <div class="sc-scroll">
        <table class="sc-table">
          <thead>
            <tr>
              <th>Name</th>
              <th class="file">File</th>
              <th class="size">Size</th>
              <th class="crc">CRC32</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="blobs">
            <tr>
              <td colspan="5" class="mute">Loading the engines...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel-foot">
      <span class="mute small" id="flash_all_hint">Changed and new engines that fit, in one go; the module restarts afterwards.</span>
      <button class="btn btn-accent" id="flash_all" disabled>Update all</button>
    </div>
  </section>

</div>
