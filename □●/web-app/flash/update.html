<!doctype html>
<html lang="en" data-bs-core="modern" data-bs-theme="dark">

<style>
</style>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Meta tags -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />

  <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" />
</head>

<body hidden>

  <div class="content-wrapper">
    <div class="container-fluid">
      <div class="row justify-content-md" style="height:10px">
      </div>
      <div class="row justify-content-md">
        <div class="col-auto hstack gap-4">
          <div class="vstack gap-2">
            <h4 class="content-title my-6">DEVICE</h4>
            <div class="hstack gap-2">
              <div class="form-floating mb-3">
                <select class="form-select form-select-lg" id="midi_targets"></select>
                <label for="midi_targets">S&C device:</label>
              </div>
            </div>
            <div class="form-floating mb-3">
              <div class="form-control form-control-lg" id="currentVersion" disabled></div>
              <label for="currentVersion">Installed firmware:</label>
            </div>
            <h4 class="content-title my-6">FIRMWARE</h4>
            <div class="hstack gap-2">
              <div class="form-floating mb-3">
                <select class="form-select form-select-lg" id="firmwares"></select>
                <label for="firmwares">Upgrade to:</label>
              </div>
              <button class="btn btn-light btn-lg" id="upgradeButton">Flash/Update</button>
            </div>
            <h4 class="content-title my-6">ENGINES/ADDONS</h4>
            <commands id="engines" />
          </div>
        </div>

        <div class="col-auto">
          <div id="setup" class="card-body mx-auto">
            <h4 class="content-title my-6">SETTINGS</h4>
            <commands id="commands" />
          </div>
        </div>
      </div>
    </div>

    <!-- <script src="./update.js" type="module"></script>

</body>

</html>
