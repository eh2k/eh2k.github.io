<!doctype html>
<html lang="en" data-bs-core="modern" data-bs-theme="dark">

<style>
</style>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Meta tags -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
  <meta name="viewport" content="width=device-width" />

  <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" />

</head>

<body>

  <div class="page-wrapper with-navbar" data-sidebar-type="overlayed-sm-and-down">

    <script src="../navbar.js" type="module"></script>

    <div class="content-wrapper">
      <div class="container-fluid">
        <div>
          <div style="height:10px">
          </div>
          <div class="hstack gap-2">
            <canvas id="display" width="128" style="width:90%;border:1px; background-color:black;" height="64"></canvas>
            <textarea rows="16" style="width:90%; font-size: small;" id="log"></textarea>
          </div>
          <div style="height:10px">
          </div>
        </div>
        <div class="hstack">
          <div id="remote">
          </div>
          <div class="col-auto">
            <div id="midi" class="vstack">
              MIDI CH: <input class="form-control" type="number" min="1" max="16" value="1" id="midi_channel"><br />
              PROGRAM: <input class="form-control" type="number" min="0" max="127" value="0" id="PROGRAM"><br />
              NOTE: <div id="PIANO" class="btn-group" role="group" aria-label="Basic outlined example"></div><br />
              PITCH-BEND: <input class="form-range" type="range" min="-1" max="1" value="0" step="0.01"
                id="PITCH"><br />
              <button class="btn" style="margin:2px" id="midi_rand">RANDOM PROG CHANGES</button>
            </div>
          </div>

          <div class="col-auto">
            CC16: <input class="form-range" type="range" min="0" max="127" value="64" id="CC16"><br />
            CC17: <input class="form-range" type="range" min="0" max="127" value="64" id="CC17"><br />
            CC18: <input class="form-range" type="range" min="0" max="127" value="64" id="CC18"><br />
            CC19: <input class="form-range" type="range" min="0" max="127" value="64" id="CC19"><br />
            CC20: <input class="form-range" type="range" min="0" max="127" value="64" id="CC20"><br />
            CC21: <input class="form-range" type="range" min="0" max="127" value="64" id="CC21"><br />
            CC22: <input class="form-range" type="range" min="0" max="127" value="64" id="CC22"><br />
            CC23: <input class="form-range" type="range" min="0" max="127" value="64" id="CC23"><br />
            Pan: <input class="form-range" type="range" min="0" max="127" value="64" id="pan"><br />
            Volume: <input class="form-range" type="range" min="0" max="127" value="64" id="volume"><br />

          </div>
        </div>
      </div>
    </div>
