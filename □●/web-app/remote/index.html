  <script type="module">

    // --- SPA Router with dynamic import() ---
    // Uses dynamic import() for proper ES module loading:
    //   - Modules appear in DevTools Sources panel with correct names
    //   - Breakpoints and source maps work reliably
    //   - Stack traces show actual call sites
    //   - Proper async error handling via try/catch

    const routes = {
      home:      { html: '../flash/loader.html' },
      update:    { html: '../flash/update.html' },
      engines:   { html: '../remote/flashdrive.html' },
      drumsynth: {
        html: '../drumsynth/index.html',
        deps: [
          'https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/wavesurfer.min.js',
          'https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/spectrogram.min.js',
          'https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/envelope.min.js',
          'https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js',
        ]
      },
      fv1emu:    { html: '../FV1emu/index.html' },
      dxfm:      { html: '../dxfm/index.html' },
      debug:     { html: '../remote/debug.html' },
    };

    // Lazy script loader — loads CDN scripts on-demand, once per session
    const _loadedScripts = new Set();
    function loadScript(url) {
      if (_loadedScripts.has(url)) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => { _loadedScripts.add(url); resolve(); };
        s.onerror = () => reject(new Error(`Failed to load: ${url}`));
        document.head.appendChild(s);
      });
    }

    let _currentCleanup = null;
    let _routeGen = 0;
    let _currentRouteKey = null;

    async function renderRoute() {
      const key = location.hash.replace('#', '') || 'home';
      const route = routes[key] || routes.home;

      // Strip query params only when switching to a different route
      if (key !== _currentRouteKey && location.search) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has("code")) {
          history.replaceState({}, '', location.pathname + "?code=" + urlParams.get("code") + location.hash);
        } else {
          history.replaceState({}, '', location.pathname + location.hash);
        }
      }
      _currentRouteKey = key;

      // Cleanup previous route module (if it exported a destroy function)
      if (_currentCleanup) {
        try { _currentCleanup(); } catch (e) { console.warn('[router] cleanup error:', e); }
        _currentCleanup = null;
      }

      // Fetch and inject HTML fragment
      try {
        const res = await fetch(route.html);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        // Parse with DOMParser to cleanly extract body content from
        // both full HTML documents and plain fragments
        const doc = new DOMParser().parseFromString(text, 'text/html');
        document.getElementById('app').innerHTML = doc.body.innerHTML;
      } catch (err) {
        console.error('[router] page load error:', err);
        document.getElementById('app').innerHTML =
          `<div class="alert alert-danger m-3">Failed to load page: ${err.message}</div>`;
        return;
      }

      document.getElementById("connect").onclick = null;
      document.getElementById("connect").disabled = true;

      // Lazy-load route-specific CDN dependencies (sequential for dependency order)
      if (route.deps) {
        try {
          for (const dep of route.deps) await loadScript(dep);
        } catch (err) {
          console.error('[router] dependency load error:', err);
        }
      }

      // Load route module via dynamic import()
      // Uses Blob + sourceURL so Chrome DevTools maps breakpoints to the real file,
      // while the unique blob URL forces re-evaluation on each route visit.
      // Relative imports are resolved to absolute URLs so they work from blob: context.
      const jsFile = route.html.replace('.html', '.js');
      const jsUrl = new URL(jsFile, location.href).href;
      const jsBase = jsUrl.substring(0, jsUrl.lastIndexOf('/') + 1);
      const gen = ++_routeGen;
      try {
        const resp = await fetch(jsUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        let source = await resp.text();
        // Rewrite relative import specifiers (from/import/side-effect) to absolute URLs
        // so they resolve correctly from the blob: origin
        source = source.replace(
          /(from\s*['"]|import\s*\(\s*['"]|import\s*['"])(\.\.?\/[^'"]+)(['"])/g,
          (_, prefix, relPath, quote) => prefix + new URL(relPath, jsBase).href + quote
        );
        const blob = new Blob(
          [source + `\n//# sourceURL=${jsUrl}\n`],
          { type: 'text/javascript' }
        );
        const blobUrl = URL.createObjectURL(blob);
        try {
          const mod = await import(blobUrl);
          if (mod.destroy && gen === _routeGen) {
            _currentCleanup = mod.destroy;
          }
        } finally {
          URL.revokeObjectURL(blobUrl);
        }
        console.debug(`[router] loaded: ${jsFile}`);
      } catch (err) {
        console.error(`[router] module error: ${jsFile}`, err);
      }
    }

    window.addEventListener('hashchange', renderRoute);
    renderRoute();
  </script>
