<!doctype html>
<html lang="en" data-bs-theme="dark">

<style>
  :root,
  [data-bs-theme=dark] {
    color-scheme: dark;
    --bs-body-color: #c9d1d9;
    --bs-body-bg: #212529;
  }
</style>

<head>
  <meta charset="utf-8">
  <!-- Meta tags -->
  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
  <meta name="viewport" content="width=device-width" />

  <link href="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/css/halfmoon-variables.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/webmidi@3.1.12/dist/iife/webmidi.iife.min.js"></script>
  <script type="text/javascript" src="./wasm/fv1.js"></script>
  <script type="module" src="./index.js" defer></script>
</head>

<body class="dark-mode with-custom-webkit-scrollbars with-custom-css-scrollbars" data-dm-shortcut-enabled="true" hidden
  data-sidebar-shortcut-enabled="true" data-set-preferred-mode-onload="true">


  <div class="page-wrapper with-navbar" data-sidebar-type="overlayed-sm-and-down">

    <div class="sticky-alerts"></div>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="#" class="navbar-brand">
        <p>□● FX-Compiler</p>
      </a>
      <div class="navbar-content ml-auto">
        <div id="user"></div>
      </div>
    </nav>
  </div>

  <div class="content-wrapper">
    <div class="container">
      <div class="card bg-transparent">
        <div class="card-body">
          <div class="sm-8">
            <div>
              <label class="col-0 form-label">FX-JSON</label>
              (<a href="https://github.com/eh2k/squares-and-circles/issues/58">Learn more</a>)
              <div class="row align-items-start">
                <select type="text" class="col form-control" id="spn"></select>
                <!-- <div class="col-0">&nbsp;</div>
                <button id="load" class="col-0 btn-light btn">Load</button> -->
              </div>
            </div>
            <div class="container h-25">
            </div>
            <div class="container">
              <div class="row align-items-start">
                <label class="col form-label">Name</label>
                <label class="col form-label">P1</label>
                <label class="col form-label">P2</label>
                <label class="col form-label">P3</label>
                <label class="col-xs-2 form-label">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
              </div>
            </div>
            <div id="bank" class="container">
              <div class="row align-items-start">
                <input type="text" class="col form-control" value="FX" placeholder="Name">
                <input type="text" class="col form-control" value="P1" placeholder="ParamA">
                <input type="text" class="col form-control" value="P2" placeholder="ParamB">
                <input type="text" class="col form-control" value="P3" placeholder="ParamB">
                <button type="button" class="col-xs-2 btn btn-link btn-sm">□●</button>
              </div>
            </div>
            <div class="container h-25">
            </div>
            <div class="container h-50">
              <div class="float-right" disabled="true">&nbsp;</div>
              <button id="compile" class="btn btn-primary float-right" disabled="true">Flash</button>
              <div class="float-right" disabled="true">&nbsp;</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/halfmoon@1.1.1/js/halfmoon.min.js"></script>

</body>

</html>
