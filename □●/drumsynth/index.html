<html>

<head>
    <meta charset="utf-8">
    <!-- phones: the page at the width of the device (without it, a 980 px page scaled down) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>□● DrumSynth</title>
    <!-- PWA: installable, offline after the first visit (sw.js) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#1d2125">
</head>

<body data-bs-core="modern" data-bs-theme="dark">

    <style>
        ::part(spec-labels) {
            position: absolute;
            right: 0;
        }

        .osc {
            width: 100%;
            box-sizing: border-box;
        }

        /* the groups of the part panel in the order of the signal (index.js setPartPanel): OSC, Filter, Out */
        .part-group {
            border: 1px solid rgba(215, 216, 219, 0.2);
            border-radius: 4px;
            padding: 6px 8px;
            min-width: 0;
        }

        /* Biquad 1, Biquad 2, VCF: a row each */
        .filter-table th,
        .filter-table td {
            padding: 2px 3px;
            font-weight: normal;
        }

        .filter-table thead th,
        .filter-table .sub th {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }

        .filter-table input,
        .filter-table select {
            font-size: 0.85em;
            padding: 1px 3px;
        }

        .filter-table tbody th[scope="row"] {
            cursor: pointer;
            white-space: nowrap;
        }

        /* at the end of a row of tabs: + and 🗑 (index.js tabTools); the name and note of the instrument (instFields) */
        .tab-tools {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: 6px;
        }

        .tab-tools .btn {
            padding: 2px 8px;
            color: rgba(255, 255, 255, 0.75);
        }

        .inst-fields {
            margin-left: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            align-items: center;
            padding: 2px 0 4px;
        }

        /* Pitch, Decay of the module (index.js knobs) */
        .knobs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.75);
        }

        .knobs label {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .knobs input {
            width: 64px;
        }

        /* the values: a width each (the row does not move while a slider is dragged) */
        .knobs span {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #pitchValue {
            width: 6.6em;
        }

        #decayValue {
            width: 3.2em;
        }

        #cc4Value {
            width: 7em;
        }

        /* the toolbar (above the instruments): sticky, over the page scrolled below it */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 1020;
            background: var(--bs-body-bg);
            border-bottom: 1px solid rgba(215, 216, 219, 0.15);
            padding: 8px 0 6px;
        }

        .logo {
            font-size: 1.5em;
            font-weight: 600;
            white-space: nowrap;
            margin-right: 8px;
        }

        /* edited, not saved: a dot after "Drumkit" */
        #modified {
            color: #fd7e14;
        }

        .dropdown-item .shortcut {
            float: right;
            margin-left: 24px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Demo, Loop and the knobs at the right */
        .toolbar .play {
            margin-left: auto;
        }

        .help {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: 1px solid currentColor;
            border-radius: 50%;
            font-size: 0.85em;
            text-decoration: none;
        }

        /* phone: a row each for the logo (and ?), the kit, file + edit + play, the knobs; not sticky (4 rows) */
        @media (max-width: 576px) {
            .toolbar {
                position: static;
            }

            .toolbar .logo {
                order: 0;
                flex: 1;
            }

            .toolbar .help {
                order: 1;
            }

            .toolbar .kit {
                order: 2;
                flex-basis: 100%;
            }

            .toolbar .file {
                order: 3;
            }

            .toolbar .play {
                order: 4;
            }

            .toolbar .knobs {
                order: 5;
            }
        }

        /* in a browser tab not wider than this, centered; installed (standalone) as wide as its window */
        @media (display-mode: browser) {
            .content-wrapper {
                max-width: 1600px;
                margin: 0 auto;
            }
        }

        .waveform ::part(wrapper) {
            --box-size: 28px;
            background-image:
                linear-gradient(transparent calc(var(--box-size) - 1px), gray var(--box-size), transparent var(--box-size)),
                linear-gradient(90deg, transparent calc(var(--box-size) - 1px), gray var(--box-size), transparent var(--box-size));
            background-size: 100% var(--box-size), var(--box-size) 100%;
            background-position: 0.5px 0.5px;
        }
    </style>

    <div class="content-wrapper">
        <div class="container-fluid">
            <div class="vstack">
                <!-- the toolbar: the kit (file, edit) at the left, playing it at the right; stays at the top -->
                <div class="toolbar hstack gap-2 flex-wrap mb-2">
                    <div class="logo">□● DrumSynth</div>
                    <div class="form-floating kit">
                        <select id="drumkitUrl" class="form-select"> </select>
                        <label for="drumkitUrl">Drumkit <span id="modified" title="edited, not saved" hidden>●</span></label>
                    </div>
                    <div class="hstack gap-2 file">
                        <button id="open" class="btn btn-secondary" title="Open a drumkit (.zip, .xml, .json), or drop it on the page (Ctrl+O)">Open</button>
                        <div class="dropdown">
                            <button id="save" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Save the drumkit as edited">Save</button>
                            <ul class="dropdown-menu">
                                <li><button id="saveJson" class="dropdown-item" title="to open it again">Save .json <span class="shortcut">Ctrl+S</span></button></li>
                                <li><button id="saveBin" class="dropdown-item" title="for the module (DRUMS/*.rc8)">Save .rc8 <span class="shortcut">module</span></button></li>
                                <li><hr class="dropdown-divider"><button id="compile" class="dropdown-item">Flash</button></li>
                            </ul>
                        </div>
                        <div class="btn-group">
                            <button id="undo" class="btn btn-secondary" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
                            <button id="redo" class="btn btn-secondary" title="Redo (Ctrl+Y)" disabled>&#8631;</button>
                        </div>
                    </div>
                    <div class="btn-group play">
                        <button id="demo" class="btn btn-primary" title="Play a short sequence with the drumkit as edited">&#9654; Demo</button>
                        <button id="loop" class="btn btn-secondary" title="Repeat 2 bars with the drumkit as edited: an edit is heard from the next bar on">&#10227; Loop</button>
                    </div>
                    <div class="knobs" title="Pitch and Decay of the module, for all instruments (not saved in the kit): all partials (&#9654;, their waveform, &#128190;), Demo and Loop; the waveform of a partial (the envelopes) shows the kit as it is. Double-click: as the module without MIDI">
                        <label>Pitch <input id="pitch" type="range" min="0.5" max="1.5" step="0.01" value="1"> <span id="pitchValue"></span></label>
                        <label>Decay <input id="decay" type="range" min="0.1" max="2" step="0.01" value="1"> <span id="decayValue"></span></label>
                        <label>HH CC4 <input id="cc4" type="range" min="0" max="127" step="1" value="0" title="The decay of the open hi-hat (MIDI note 46) by MIDI CC4 of the module (the hi-hat pedal): 0 open, Decay + 0.1 .. 127 closed, 0.1; a closed hi-hat (42, 44) mutes the open one (Demo, Loop). Double-click: 0 (the module without MIDI)"> <span id="cc4Value"></span></label>
                    </div>
                    <a class="help" href="https://github.com/eh2k/squares-and-circles/issues/130" title="Learn more" target="_blank" rel="noopener">?</a>
                    <div hidden>
                        <button id="load" class="btn-light btn">Load</button>
                    </div>
                </div>
                <div id="error" class="alert alert-danger" role="alert" style="white-space: pre-wrap" hidden></div>
                <div id="trigs"></div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/wavesurfer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/spectrogram.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/envelope.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" />

    <script src="index.js" type="module"></script>
    <script>
        // only in a secure context (https, localhost)
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch((e) => console.log("service worker", e));
        }
    </script>
</body>

</html>
