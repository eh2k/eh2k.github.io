<html lang="en" data-bs-core="modern" data-bs-theme="dark">

<style>
    ::part(spec-labels) {
        position: absolute;
        right: 0;
    }

    textarea {
        min-height: 260px;
        max-width: 100px;
    }

    .osc {
        width: 100px;
    }

    .waveform ::part(wrapper) {
        --box-size: 28px;
        background-image:
            linear-gradient(transparent calc(var(--box-size) - 1px), gray var(--box-size), transparent var(--box-size)),
            linear-gradient(90deg, transparent calc(var(--box-size) - 1px), gray var(--box-size), transparent var(--box-size));
        background-size: 100% var(--box-size), var(--box-size) 100%;
        background-position: 0.5px 0.5px;
    }
</style>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="wasm/wasm_exec.js"></script>
    <script type="text/javascript" src="wasm/drumsynth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/wavesurfer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/spectrogram.min.js"
        type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.14/dist/plugins/envelope.min.js"
        type="text/javascript"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7.8.11/dist/plugins/zoom.min.js"
    type="text/javascript"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webmidi@3.1.12/dist/iife/webmidi.iife.min.js"></script>
    <script type="module" src="./index.js"></script>
</head>

<body id="body" hidden>


    <!-- Navbar -->
    <nav class="navbar">
        <div class="container-fluid">
            <a href="#" class="navbar-brand" aria-label="DrumSynth Home">
                <p>□● DrumSynth</p>
            </a>
            <div class="navbar-content ml-auto">
                <div id="user"></div>
            </div>
        </div>
    </nav>


    <div class="content-wrapper">
        <div class="container">
            <div class="card bg-transparent">
                <div class="card-body">
                    <div class="sm-8">
                        <div class="row align-items-start">
                            <div class="col">
                                <label class="h4">Drumkit </label> (<a href="https://github.com/eh2k/squares-and-circles/issues/130">Learn more</a>)
                                <!-- <input type="text" class="form-control" id="drumkitUrl" value="drumkits/RC-808.json"
                                    placeholder="https://raw.githubusercontent.com/..."> -->
                                <select id="drumkitUrl" class="form-select">
                                    <!-- <option value="drumkits/RC-808.json">drumkits/RC-808.json</option> -->
                                </select>
                            </div>
                            <div class="col-auto" hidden>
                                <button id="load" class="btn-light btn">Load</button>
                            </div>
                        </div>
                    </div>
                    <div id="bank" class="container" style="margin-bottom: 20px;"></div>
                    <div class="grid" id="trigs"></div>
                </div>
                <div class="container h-100 d-flex justify-content-end align-items-center" style="margin-bottom: 20px;">
                    <button id="compile" class="btn btn-primary mx-2">Flash</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>

</body>

</html>
